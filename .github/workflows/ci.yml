name: ECIS CI/CD
on:
  push:
    branches: [main, v8-development, v9-development]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/ --select E,F,W --ignore E501,E402,F401

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecis_test
          POSTGRES_USER: ecis
          POSTGRES_PASSWORD: ecis_test_pass
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest tests/ -v --tb=short --ignore=tests/e2e --ignore=tests/test_h5_frontend.py --ignore=tests/test_e2e.py
        env:
          DATABASE_URL: postgresql://ecis:ecis_test_pass@localhost:5432/ecis_test
          REDIS_URL: redis://localhost:6379/0

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v9-development'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: docker compose -f docker-compose.test.yml up -d
      - run: sleep 10
      - run: PYTHONPATH=src python tests/e2e/run_e2e.py || true
      - run: docker compose -f docker-compose.test.yml down
