name: ECIS CI/CD
on:
  push:
    branches: [main, v8-development, v9-development]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ --select E,F,W --ignore E501,E402,F401

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecis_test
          POSTGRES_USER: ecis
          POSTGRES_PASSWORD: ecis_test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest tests/ -v --tb=short --ignore=tests/e2e --ignore=tests/test_h5_frontend.py --ignore=tests/test_e2e.py --ignore=tests/test_api_integration.py --ignore=tests/test_core.py --ignore=tests/test_integration_comprehensive.py --ignore=tests/test_models.py --ignore=tests/test_services.py --ignore=tests/test_templates.py
        env:
          DATABASE_URL: postgresql://ecis:ecis_test_pass@localhost:5432/ecis_test
          REDIS_URL: redis://localhost:6379/0

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/v9-development' && github.event_name == 'push'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /root/projects/ecis/deploy.sh
